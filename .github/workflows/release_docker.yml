# Builds a Docker image in Release/Debug mode and deploys it to DockerHub.
# Build is distributed across multiple runners based on:
# https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
name: Release Docker

on:
  workflow_call:
    inputs:
      image:
        description: "Name of the Docker image (e.g. movesrwth/storm)"
        required: true
        type: string
      tag:
        description: "Docker tag (e.g. 1.1.0 or stable); the same git ref is checked out"
        required: true
        type: string
      dockerfile:
        description: "Path to the Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      nr_threads:
        description: "Number of parallel build jobs"
        required: false
        type: string
        # GitHub runners currently have 4 cores
        default: "4"
      build_args:
        description: "Additional build arguments (one KEY=value per line) for both variants"
        required: false
        type: string
        default: ""
      debug_build_args:
        description: "Additional build arguments (one KEY=value per line) for the Debug variant only"
        required: false
        type: string
        default: ""
      release_build_args:
        description: "Additional build arguments (one KEY=value per line) for the Release variant only"
        required: false
        type: string
        default: ""
    secrets:
      STORM_CI_DOCKER_USERNAME:
        description: "DockerHub user name"
        required: false
      STORM_CI_DOCKER_TOKEN:
        description: "DockerHub access token"
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image.tag }} on ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        image:
          - {tag: "${{ inputs.tag }}-debug", buildType: "Debug"}
          - {tag: "${{ inputs.tag }}", buildType: "Release"}
        platform:
          - {name: linux/amd64, runner: "ubuntu-latest"}
          - {name: linux/arm64, runner: "ubuntu-24.04-arm"}
    steps:
      - name: Git clone
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Prepare
        # Sanitize platform name
        run: |
          platform=${{ matrix.platform.name }}
          echo "PLATFORM=${platform//\//-}" >> $GITHUB_ENV
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,${{ matrix.image.tag }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        # Only login if using original repo
        if: github.repository_owner == 'stormchecker'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.STORM_CI_DOCKER_USERNAME }}
          password: ${{ secrets.STORM_CI_DOCKER_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          file: ${{ inputs.dockerfile }}
          # Set build arguments (empty lines are ignored)
          build-args: |
            build_type=${{ matrix.image.buildType }}
            no_threads=${{ inputs.no_threads }}
            ${{ inputs.build_args }}
            ${{ matrix.image.buildType == 'Debug' && inputs.debug_build_args || '' }}
            ${{ matrix.image.buildType == 'Release' && inputs.release_build_args || '' }}
          platforms: ${{ matrix.platform.name }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/${{ matrix.image.tag }}
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${{ matrix.image.tag }}/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image.tag }}-digests-${{ env.PLATFORM }}
          path: ${{ runner.temp }}/digests/${{ matrix.image.tag }}/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests for ${{ matrix.image.tag }}
    runs-on: ubuntu-latest
    needs:
      - build
    strategy:
      matrix:
        image:
          # Must be the same as above
          - {tag: "${{ inputs.tag }}-debug"}
          - {tag: "${{ inputs.tag }}"}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests/${{ matrix.image.tag }}
          pattern: ${{ matrix.image.tag }}-digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,${{ matrix.image.tag }}
      - name: Login to Docker Hub
        # Only login if using original repo
        if: github.repository_owner == 'stormchecker'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.STORM_CI_DOCKER_USERNAME }}
          password: ${{ secrets.STORM_CI_DOCKER_TOKEN }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests/${{ matrix.image.tag }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json}}') \
            $(printf '${{ inputs.image }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ inputs.image }}:${{ steps.meta.outputs.version }}
