# Send a notification email in case of a CI failure
name: Email notification

on:
  workflow_call:
    inputs:
      title:
        description: "Name of the workflow used in the email subject"
        required: false
        type: string
        default: "CI"


jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Get failed jobs
        id: check
        # Considers all jobs of the calling workflow run, including indirect dependencies.
        # The currently running notify job has no conclusion yet and is therefore ignored.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=$(gh api --paginate --slurp repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            | jq -r '[.[].jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] | join(", ")')
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.failed != ''  # notify only if failure
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.STORM_CI_MAIL_SERVER }}
          server_port: 587
          username: ${{ secrets.STORM_CI_MAIL_USERNAME }}
          password: ${{ secrets.STORM_CI_MAIL_PASSWORD }}
          subject: "[You broke it] ${{ inputs.title }} failed for ${{ github.repository }}"
          body:
            "${{ inputs.title }} of ${{ github.repository }} has failed for commit ${{ github.sha }}.\n\
            Failed jobs: ${{ steps.check.outputs.failed }}\n\n\
            For more information, see https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          to: ${{ secrets.STORM_CI_MAIL_RECIPIENTS }}
          from: Github Actions <you-broke-it@stormchecker.org>
